name: Publish Package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list package contents and release notes without publishing)"
        required: false
        default: true
        type: boolean

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    # workflow_dispatch can't hide its branch picker; publish only runs (via needs) from main
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: write

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # for npm trusted publishing and provenance
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run generate

      - name: Build package
        run: |
          pnpm run build
          rm -rf src/generated
          rm -rf dist/generated

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Fast-forward beta to main
        if: github.event_name == 'push'
        # semantic-release needs a local beta branch to read its tags
        run: |
          git push origin HEAD:refs/heads/beta
          git checkout -B beta

      - name: Semantic Release (beta)
        if: github.event_name == 'push'
        # semantic-release takes the branch from GITHUB_REF
        run: GITHUB_REF=refs/heads/beta pnpm exec semantic-release

      - name: Semantic Release (dry-run)
        if: inputs.dry_run
        run: |
          echo "## Semantic Release Dry Run"
          echo "This shows what would be released without making any changes:"
          echo ""
          pnpm exec semantic-release --dry-run
          echo ""
          echo "## Package Contents Preview"
          echo "The following files would be included in the npm package:"
          echo ""
          pnpm pack

      - name: Semantic Release
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: pnpm exec semantic-release

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "## Dry Run Complete" >> $GITHUB_STEP_SUMMARY
            echo "Semantic release dry run has been completed. Check the logs above for details on what would be released." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
            echo "Semantic release has completed successfully! Check the logs above for details." >> $GITHUB_STEP_SUMMARY
            echo "Visit the [releases page](https://github.com/${{ github.repository }}/releases) to see the new release." >> $GITHUB_STEP_SUMMARY
          fi
